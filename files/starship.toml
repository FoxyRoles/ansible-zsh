# Agnoster-like theme

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$php\
$nodejs\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Powerline segmenty
right_format = ""
continuation_prompt = "[❯❯ ](bright-black)"

[palettes.agnoster]
bg_blue = "#005fff"

[username]
show_always = false
format = "[$user]($style)"
style_user = "bold bg:blue fg:black"
style_root = "bold bg:red fg:white"

[hostname]
ssh_only = true
format = "[@$hostname ]($style)"
style = "bold bg:blue fg:black"

[directory]
format = "[ $path ]($style)"
style = "bold bg:blue fg:white"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
format = "[ $symbol$branch ]($style)"
style = "bold bg:green fg:black"
symbol = " "

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bold bg:green fg:black"
conflicted = " =${count}"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count}⇣${behind_count}"
untracked = " ?${count}"
stashed = " *${count}"
modified = " !${count}"
staged = " +${count}"

[php]
format = "[ $symbol$version ]($style)"
style = "bold bg:purple fg:white"
symbol = " "

[nodejs]
format = "[ $symbol$version ]($style)"
style = "bold bg:green fg:white"
symbol = " "

[docker_context]
format = "[ $symbol$context ]($style)"
style = "bold bg:cyan fg:black"

[cmd_duration]
format = "[ $duration ]($style)"
style = "bold bg:yellow fg:black"
min_time = 2_000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
